openapi: 3.0.3
info:
  title: CinemaAbyss API
  description: |
    API specification for the CinemaAbyss system, covering the monolith and the microservices.

    CinemaAbyss is a platform for managing movies, users, payments and subscriptions.
    The system architecture includes a monolithic application and dedicated microservices.
  version: 1.0.0
  contact:
    name: CinemaAbyss Team
    email: support@cinemaabyss.com

servers:
  - url: http://localhost:8000
    description: API Gateway (Proxy Service)
  - url: http://localhost:8080
    description: Monolith application
  - url: http://localhost:8081
    description: Movies microservice
  - url: http://localhost:8082
    description: Events microservice

tags:
  - name: users
    description: User operations
  - name: movies
    description: Movie operations
  - name: payments
    description: Payment operations
  - name: subscriptions
    description: Subscription operations
  - name: events
    description: Event operations
  - name: health
    description: Service health checks

paths:
  # Common health check endpoints
  /health:
    get:
      tags:
        - health
      summary: API Gateway health check
      description: Returns the health status of the proxy service
      operationId: getProxyHealth
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: Strangler Fig Proxy is healthy

  # Monolith and movies microservice
  /api/movies:
    get:
      tags:
        - movies
      summary: Get all movies
      description: Returns the list of all movies with their metadata
      operationId: getAllMovies
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - movies
      summary: Create a movie
      description: Adds a new movie to the system
      operationId: createMovie
      requestBody:
        description: Movie data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '201':
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/movies/health:
    get:
      tags:
        - health
      summary: Movies microservice health check
      description: Returns the health status of the movies microservice
      operationId: getMoviesServiceHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true

  # Monolith - users
  /api/users:
    get:
      tags:
        - users
      summary: Get all users
      description: Returns the list of all users in the system
      operationId: getAllUsers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - users
      summary: Create a user
      description: Registers a new user in the system
      operationId: createUser
      requestBody:
        description: User data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Monolith - payments
  /api/payments:
    get:
      tags:
        - payments
      summary: Get all payments
      description: Returns the list of all payments in the system
      operationId: getAllPayments
      parameters:
        - name: user_id
          in: query
          description: User ID to filter payments by
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - payments
      summary: Create a payment
      description: Registers a new payment in the system
      operationId: createPayment
      requestBody:
        description: Payment data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Monolith - subscriptions
  /api/subscriptions:
    get:
      tags:
        - subscriptions
      summary: Get all subscriptions
      description: Returns the list of all subscriptions in the system
      operationId: getAllSubscriptions
      parameters:
        - name: user_id
          in: query
          description: User ID to filter subscriptions by
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - subscriptions
      summary: Create a subscription
      description: Registers a new subscription in the system
      operationId: createSubscription
      requestBody:
        description: Subscription data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '201':
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Events microservice
  /api/events/health:
    get:
      tags:
        - health
      summary: Events microservice health check
      description: Returns the health status of the events microservice
      operationId: getEventsServiceHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true

  /api/events/movie:
    post:
      tags:
        - events
      summary: Create a movie event
      description: Registers a new event related to a movie
      operationId: createMovieEvent
      requestBody:
        description: Movie event data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieEvent'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/user:
    post:
      tags:
        - events
      summary: Create a user event
      description: Registers a new event related to a user
      operationId: createUserEvent
      requestBody:
        description: User event data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEvent'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/payment:
    post:
      tags:
        - events
      summary: Create a payment event
      description: Registers a new event related to a payment
      operationId: createPaymentEvent
      requestBody:
        description: Payment event data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentEvent'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # Core data models
    Movie:
      type: object
      properties:
        id:
          type: integer
          description: Unique movie identifier
          example: 1
        title:
          type: string
          description: Movie title
          example: "Inception"
        description:
          type: string
          description: Movie description
          example: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O."
        genres:
          type: array
          description: Movie genres
          items:
            type: string
          example: ["Sci-Fi", "Action", "Thriller"]
        rating:
          type: number
          format: float
          description: Movie rating
          example: 8.8
      required:
        - id
        - title
        - description
        - rating

    MovieInput:
      type: object
      properties:
        title:
          type: string
          description: Movie title
          example: "Inception"
        description:
          type: string
          description: Movie description
          example: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O."
        genres:
          type: array
          description: Movie genres
          items:
            type: string
          example: ["Sci-Fi", "Action", "Thriller"]
        rating:
          type: number
          format: float
          description: Movie rating
          example: 8.8
      required:
        - title
        - description
        - rating

    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique user identifier
          example: 1
        username:
          type: string
          description: Username
          example: "john_doe"
        email:
          type: string
          format: email
          description: User email
          example: "john.doe@example.com"
      required:
        - id
        - username
        - email

    UserInput:
      type: object
      properties:
        username:
          type: string
          description: Username
          example: "john_doe"
        email:
          type: string
          format: email
          description: User email
          example: "john.doe@example.com"
      required:
        - username
        - email

    Payment:
      type: object
      properties:
        id:
          type: integer
          description: Unique payment identifier
          example: 1
        user_id:
          type: integer
          description: ID of the user who made the payment
          example: 1
        amount:
          type: number
          format: float
          description: Payment amount
          example: 9.99
        timestamp:
          type: string
          format: date-time
          description: Time the payment was made
          example: "2023-01-15T14:30:00Z"
      required:
        - id
        - user_id
        - amount
        - timestamp

    PaymentInput:
      type: object
      properties:
        user_id:
          type: integer
          description: ID of the user making the payment
          example: 1
        amount:
          type: number
          format: float
          description: Payment amount
          example: 9.99
      required:
        - user_id
        - amount

    Subscription:
      type: object
      properties:
        id:
          type: integer
          description: Unique subscription identifier
          example: 1
        user_id:
          type: integer
          description: ID of the user who took out the subscription
          example: 1
        plan_type:
          type: string
          description: Subscription plan type
          example: "premium"
        start_date:
          type: string
          format: date-time
          description: Subscription start date
          example: "2023-01-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          description: Subscription end date
          example: "2023-12-31T23:59:59Z"
      required:
        - id
        - user_id
        - plan_type
        - start_date
        - end_date

    SubscriptionInput:
      type: object
      properties:
        user_id:
          type: integer
          description: ID of the user taking out the subscription
          example: 1
        plan_type:
          type: string
          description: Subscription plan type
          example: "premium"
        start_date:
          type: string
          format: date-time
          description: Subscription start date
          example: "2023-01-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          description: Subscription end date
          example: "2023-12-31T23:59:59Z"
      required:
        - user_id
        - plan_type
        - start_date
        - end_date

    # Event models
    Event:
      type: object
      properties:
        id:
          type: string
          description: Unique event identifier
          example: "movie-1-viewed"
        type:
          type: string
          description: Event type
          example: "movie"
        timestamp:
          type: string
          format: date-time
          description: Event time
          example: "2023-01-15T14:30:00Z"
        payload:
          type: object
          description: Event payload (depends on the event type)
      required:
        - id
        - type
        - timestamp
        - payload

    MovieEvent:
      type: object
      properties:
        movie_id:
          type: integer
          description: Movie identifier
          example: 1
        title:
          type: string
          description: Movie title
          example: "Inception"
        action:
          type: string
          description: Action performed on the movie
          example: "viewed"
        user_id:
          type: integer
          description: User identifier (optional)
          example: 1
        rating:
          type: number
          format: float
          description: Rating (optional)
          example: 8.5
        genres:
          type: array
          description: Movie genres (optional)
          items:
            type: string
          example: ["Sci-Fi", "Action"]
        description:
          type: string
          description: Movie description (optional)
          example: "A mind-bending thriller"
      required:
        - movie_id
        - title
        - action

    UserEvent:
      type: object
      properties:
        user_id:
          type: integer
          description: User identifier
          example: 1
        username:
          type: string
          description: Username (optional)
          example: "john_doe"
        email:
          type: string
          description: User email (optional)
          example: "john.doe@example.com"
        action:
          type: string
          description: Action performed by the user
          example: "registered"
        timestamp:
          type: string
          format: date-time
          description: Event time
          example: "2023-01-15T14:30:00Z"
      required:
        - user_id
        - action
        - timestamp

    PaymentEvent:
      type: object
      properties:
        payment_id:
          type: integer
          description: Payment identifier
          example: 1
        user_id:
          type: integer
          description: User identifier
          example: 1
        amount:
          type: number
          format: float
          description: Payment amount
          example: 9.99
        status:
          type: string
          description: Payment status
          example: "completed"
        timestamp:
          type: string
          format: date-time
          description: Payment time
          example: "2023-01-15T14:30:00Z"
        method_type:
          type: string
          description: Payment method type (optional)
          example: "credit_card"
      required:
        - payment_id
        - user_id
        - amount
        - status
        - timestamp

    EventResponse:
      type: object
      properties:
        status:
          type: string
          description: Operation status
          example: "success"
        partition:
          type: integer
          description: Kafka partition
          example: 0
        offset:
          type: integer
          description: Offset within the Kafka partition
          example: 42
        event:
          $ref: '#/components/schemas/Event'
      required:
        - status
        - partition
        - offset
        - event

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Internal Server Error"
      required:
        - error
