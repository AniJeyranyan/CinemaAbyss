{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # All traffic goes through the proxy (API Gateway), including /api/events for the event tests
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: {{ .Values.proxyService.service.port }}
{{- end }}
