{{- if .Values.moviesService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.moviesService.replicas }}
  selector:
    matchLabels:
      app: movies-service
  template:
    metadata:
      labels:
        app: movies-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: movies-service
          image: "{{ .Values.moviesService.image.repository }}:{{ .Values.moviesService.image.tag }}"
          imagePullPolicy: {{ .Values.moviesService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.moviesService.port }}
          env:
            - name: PORT
              value: {{ .Values.moviesService.port | quote }}
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ConnectionStrings__Default
          readinessProbe:
            httpGet:
              path: /api/movies/health
              port: {{ .Values.moviesService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: movies-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.moviesService.service.type }}
  selector:
    app: movies-service
  ports:
    - port: {{ .Values.moviesService.service.port }}
      targetPort: {{ .Values.moviesService.port }}
{{- end }}
