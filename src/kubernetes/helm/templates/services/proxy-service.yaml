{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: proxy-service
          image: "{{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}"
          imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxyService.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.proxyService.service.targetPort | quote }}
            - name: MONOLITH_URL
              value: {{ .Values.config.monolithUrl | quote }}
            - name: MOVIES_SERVICE_URL
              value: {{ .Values.config.moviesServiceUrl | quote }}
            - name: EVENTS_SERVICE_URL
              value: {{ .Values.config.eventsServiceUrl | quote }}
            - name: GRADUAL_MIGRATION
              value: {{ .Values.config.gradualMigration | quote }}
            - name: MOVIES_MIGRATION_PERCENT
              value: {{ .Values.config.moviesMigrationPercent | quote }}
          resources:
            {{- toYaml .Values.proxyService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxyService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.proxyService.service.type }}
  selector:
    app: proxy-service
  ports:
    - port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
{{- end }}
