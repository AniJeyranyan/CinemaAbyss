# Runs with `helm test cinemaabyss` after install/upgrade.
# Checks each service from inside the cluster (no ingress needed), mirroring the Postman "health" and "event creation" checks.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-api-tests
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: api-tests
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-ec"]
      args:
        - |
          check() {
            name=$1; url=$2
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            echo "$name -> $url [$code]"
            [ "$code" = "200" ] || { echo "FAILED: $name"; exit 1; }
          }
          check "monolith health"        http://monolith:8080/health
          check "movies-service health"  http://movies-service:8081/api/movies/health
          check "events-service health"  http://events-service:8082/api/events/health
          check "proxy health"           http://proxy-service:80/health
          check "proxy -> movies"        http://proxy-service:80/api/movies
          check "proxy -> users"         http://proxy-service:80/api/users

          post() {
            name=$1; url=$2; body=$3
            resp=$(curl -s -w '\n%{http_code}' --max-time 10 -H 'Content-Type: application/json' -d "$body" "$url")
            code=$(echo "$resp" | tail -n1)
            echo "$name -> $url [$code]"
            echo "$resp" | head -n -1 | grep -q '"status"' || { echo "FAILED: $name has no status in response"; exit 1; }
            [ "$code" = "201" ] || { echo "FAILED: $name"; exit 1; }
          }
          post "create movie event"   http://events-service:8082/api/events/movie   '{"movie_id":1,"title":"Test Movie Event","action":"viewed","user_id":1}'
          post "create user event"    http://events-service:8082/api/events/user    '{"user_id":1,"username":"testuser","action":"logged_in","timestamp":"2026-10-04T12:00:00Z"}'
          post "create payment event" http://events-service:8082/api/events/payment '{"payment_id":1,"user_id":1,"amount":9.99,"status":"completed","timestamp":"2026-10-04T12:00:00Z","method_type":"credit_card"}'
          echo "ALL API CHECKS PASSED"
