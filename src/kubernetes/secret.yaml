apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cinemaabyss
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_password
  # Same database as docker-compose; the monolith and movies-service share it during the migration
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cinemaabyss;Username=postgres;Password=postgres_password"
