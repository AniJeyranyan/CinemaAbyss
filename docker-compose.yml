version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: cinemaabyss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: cinemaabyss-zookeeper
    ports:
      - "2181:2181"
    networks:
      - cinemaabyss-network

  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: cinemaabyss-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cinemaabyss-network

  # Monolith (Clean Architecture ASP.NET Core Web API): users, movies, payments, subscriptions.
  # Owns the database schema - runs EF Core migrations + seed data on startup.
  monolith:
    build:
      context: .
      dockerfile: src/Monolith/CinemaAbyss.Monolith.Api/Dockerfile
    container_name: cinemaabyss-monolith
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cinemaabyss;Username=postgres;Password=postgres_password"
    networks:
      - cinemaabyss-network

  # Movies microservice, extracted from the monolith (Strangler Fig). Shares the
  # same database while the migration is in progress.
  movies-service:
    build:
      context: .
      dockerfile: src/Movies/CinemaAbyss.Movies.Api/Dockerfile
    container_name: cinemaabyss-movies-service
    depends_on:
      - monolith
    restart: on-failure:5
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cinemaabyss;Username=postgres;Password=postgres_password"
    networks:
      - cinemaabyss-network

  # Events microservice (C#): produces User/Payment/Movie events to Kafka and consumes them back, logging each one.
  events-service:
    build:
      context: ./src/microservices/events
      dockerfile: CinemaAbyss.Events.Api/Dockerfile
    container_name: cinemaabyss-events-service
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: events-service
    networks:
      - cinemaabyss-network

  # Proxy service (API Gateway, C#) implementing the Strangler Fig pattern.
  proxy-service:
    build:
      context: ./src/microservices/proxy
      dockerfile: CinemaAbyss.Proxy.Api/Dockerfile
    container_name: cinemaabyss-proxy-service
    depends_on:
      - monolith
      - movies-service
      - events-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONOLITH_URL: http://monolith:8080
      MOVIES_SERVICE_URL: http://movies-service:8081
      EVENTS_SERVICE_URL: http://events-service:8082
      GRADUAL_MIGRATION: "true"
      MOVIES_MIGRATION_PERCENT: "50"
    networks:
      - cinemaabyss-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cinemaabyss-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinemaabyss
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - cinemaabyss-network

volumes:
  postgres-data:

networks:
  cinemaabyss-network:
    name: cinemaabyss-network
    driver: bridge
